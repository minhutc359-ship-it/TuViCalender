<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AstroAI — Tarot Animation Concept</title>
<style>
:root{color-scheme:dark;--gold:#debd81;--ink:#080f23;--purple:#1e1747}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,serif;color:#f3e5c9;background:radial-gradient(ellipse at 50% 0%,#35305b 0%,#11152f 42%,#070d1c 95%);display:flex;align-items:center;justify-content:center;padding:34px 15px 80px}main{width:min(950px,100%);text-align:center}header small{text-transform:uppercase;color:#d8b985;letter-spacing:.42em}h1{font-size:clamp(2rem,5vw,3.7rem);margin:10px 0;font-weight:400;letter-spacing:.12em}header p{font-family:system-ui,sans-serif;color:#aaaac6;font-size:14px;margin-bottom:25px}.table{border:1px solid #74618788;min-height:440px;border-radius:50%/18%;background:radial-gradient(ellipse at center,#30254a 0%,#191b3b 52%,#0c1429 80%);box-shadow:0 0 0 9px #6d52602e,0 36px 120px #030715;display:flex;align-items:center;justify-content:center;gap:clamp(5px,2.5vw,30px);padding:28px 8px;position:relative;overflow:hidden}.table:before{content:'✧';font-size:330px;color:#a8967430;position:absolute;pointer-events:none}.slot{width:clamp(88px,22vw,184px);aspect-ratio:2/3;perspective:1000px;z-index:2}.flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.76,.1,1.04),translate .65s ease;cursor:pointer;border-radius:10px;box-shadow:0 18px 34px #06091888}.slot:hover .flip:not(.revealed){translate:0 -12px}.flip.revealed{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;background-size:cover;background-position:center;border:1px solid #d7bc7d}.face.back{background-image:url('assets/card_back.svg')}.front{transform:rotateY(180deg)}.one{background-image:url('assets/00_the_fool.svg')}.two{background-image:url('assets/01_the_magician.svg')}.three{background-image:url('assets/02_the_high_priestess.svg')}.caption{color:#d6c4a2;font-family:system-ui,sans-serif;font-size:12px;margin-top:12px;text-transform:uppercase;letter-spacing:.15em}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}button{border-radius:999px;border:1px solid #b99460;padding:11px 20px;background:#b38d56;color:#0b1223;font-weight:650;cursor:pointer;font-family:system-ui,sans-serif}button.secondary{background:#1b2040;color:#ead2ab}button:focus-visible,.flip:focus-visible{outline:3px solid #fce4ad;outline-offset:4px}.hint{font-family:system-ui,sans-serif;font-size:13px;color:#a3a2bd;margin-top:17px}.shake .slot:nth-child(1){animation:riffle .52s 0s 2}.shake .slot:nth-child(2){animation:riffle .52s .09s 2}.shake .slot:nth-child(3){animation:riffle .52s .17s 2}@keyframes riffle{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(30px,-25px) rotate(8deg)}65%{transform:translate(-23px,14px) rotate(-7deg)}100%{transform:translate(0,0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}@media(max-width:480px){.table{min-height:320px;padding:16px 3px}.caption{font-size:10px}.slot{width:28%}}
</style></head><body><main><header><small>AstroAI / Trải bài huyền tinh</small><h1>Thông điệp từ các vì sao</h1><p>Bản xem thử hình ảnh và hoạt ảnh · toàn bộ minh họa là concept gốc</p></header><div class="table" id="table"><div class="slot"><div class="flip" tabindex="0" role="button" aria-label="Lật lá bài Quá khứ"><div class="face back"></div><div class="face front one"></div></div><div class="caption">Quá khứ</div></div><div class="slot"><div class="flip" tabindex="0" role="button" aria-label="Lật lá bài Hiện tại"><div class="face back"></div><div class="face front two"></div></div><div class="caption">Hiện tại</div></div><div class="slot"><div class="flip" tabindex="0" role="button" aria-label="Lật lá bài Tương lai"><div class="face back"></div><div class="face front three"></div></div><div class="caption">Tương lai</div></div></div><div class="controls"><button id="shuffle">✦ Xào bài</button><button id="reveal" class="secondary">Lật cả 3 lá</button><button id="reset" class="secondary">Úp bài lại</button></div><p class="hint">Nhấp vào từng lá để lật • trải nghiệm mẫu chưa có engine Tarot/ngẫu nhiên hóa thật</p></main><script>const cards=[...document.querySelectorAll('.flip')],table=document.getElementById('table');const flip=c=>c.classList.toggle('revealed');cards.forEach(c=>{c.addEventListener('click',()=>flip(c));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip(c)}})});document.getElementById('reset').onclick=()=>cards.forEach(c=>c.classList.remove('revealed'));document.getElementById('reveal').onclick=()=>cards.forEach((c,i)=>setTimeout(()=>c.classList.add('revealed'),i*300));document.getElementById('shuffle').onclick=()=>{cards.forEach(c=>c.classList.remove('revealed'));table.classList.remove('shake');void table.offsetWidth;table.classList.add('shake');setTimeout(()=>table.classList.remove('shake'),1400)};</script></body></html>
